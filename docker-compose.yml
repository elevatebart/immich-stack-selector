# Nothing runs permanently. `docker compose run --rm job build --periodic 14` stacks
# new photos and exits; `docker compose up -d ui` brings the review page up when you
# want it, `docker compose stop ui` takes it down.
x-common: &common
  image: ghcr.io/elevatebart/immich-stack-selector:latest
  # build: .   # uncomment to build on the NAS instead of pulling
  environment:
    IMMICH_URL: ${IMMICH_URL}
    IMMICH_API_KEY: ${IMMICH_API_KEY}
    TIME_WINDOW_S: ${TIME_WINDOW_S:-120}
    LOCATION_RADIUS_M: ${LOCATION_RADIUS_M:-30}
    SIM_THRESHOLD: ${SIM_THRESHOLD:-0.85}
    CLUSTER_MODE: ${CLUSTER_MODE:-chain}
    WORKERS: ${WORKERS:-4}
    # timers only matter for a long-running ui service; 0 keeps everything on demand
    SYNC_EVERY_MIN: ${SYNC_EVERY_MIN:-0}
    BUILD_EVERY_MIN: ${BUILD_EVERY_MIN:-0}
    BUILD_WINDOW_DAYS: ${BUILD_WINDOW_DAYS:-14}
  volumes:
    - ./data:/data

services:
  job:
    <<: *common
    profiles: [job]
    command: build --periodic 14

  ui:
    <<: *common
    container_name: immich-stack-selector
    profiles: [ui]
    ports:
      - "8000:8000"
