[project]
name = "immich-stack-selector"
version = "0.1.0"
description = "Pick the best frame of each Immich stack, review it, trash the rest."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
aesthetic = ["torch>=2.2", "open-clip-torch>=2.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
